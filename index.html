<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--navbar-->
          
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a href="#" class="navbar-brand fw-bold">Foodie</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
            </button>

             <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="#home" class="nav-link">Home</a>
                    </li>

                    <li class="nav-item">
                        <a href="#menu" class="nav-link">Menu</a>
                    </li>

                    <li class="nav-item">
                        <a href="#contact" class="nav-link">Contact</a>
                    </li>
                </ul>
             </div>


        </div>
    </nav>


    <!---Hero Section-->

<section id="home" class="hero-section text-center">
    <div class="container">
        <h1>Delicious Food Delivered To You</h1>
        <p>Order your favorite meals anytime, anywhere.</p>
        <button class="btn btn-success btn-lg">Order Now</button>
    </div>
</section>

<!--Menu Section-->

<section id="menu" class="py-5">
    <div class="container">
        <h2 class="text-center mb-4">Popular Dishes</h2>

        <div class="row g-4">

            <div class="card col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd" alt="Burger" class="card-img-top">
                </div>
                <div class="card-body text-center">
                <h5>Burger</h5>
                <p>$200</p>
                <button class="btn btn-success">Add to Cart</button>
                </div>
           </div>


            <div class="card col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591" alt="Pizza" class="card-img-top">
                </div>
                <div class="card-body text-center">
                    <h5>Pizzza</h5>
                    <p>$300</p>
                    <button class="btn btn-success">Add to cart</button>
                </div>
            </div>

            <div class="card col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d" alt="Pasta" class="card-img-top">
                </div>
                <div class="card-body text-center">
                    <h5>Pasta</h5>
                    <p>$250</p>
                    <button class="btn btn-success">Add to cart</button>
                </div>
            </div>


        </div>
    </div>
</section>

<!--Contact section-->

<section id="contact" class="bg-light py-5">
    <div class="container">
        <h2 class="text-center mb-4">Contact Us</h2>

        <form>

            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Your Name">
            </div>

            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Your Email">
            </div>

            <div class="mb-3">
                <textarea rows="4" class="form-control" placeholder="Message"></textarea>
            </div>

            <button class="btn btn-primary">Send Message</button>
        </form>
    </div>
</section>

<!--Footer-->

<footer class="bg-dark text-white text-center p-3">
     © 2026 Foodie | All Rights Reserved
</footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
